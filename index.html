<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Repo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="container mt-4">
    <h1>Music List</h1>
    <div id="app">
        <!-- Search and Sort Controls -->
        <div class="row mb-3">
            <div class="col-md-4">
                <input id="titleSearch" type="text" class="form-control" v-model="filters.title" placeholder="Filter by Title..." @input="getRecords">
            </div>
            <div class="col-md-4">
                <input id="artistSearch" type="text" class="form-control" v-model="filters.artist" placeholder="Filter by Artist..." @input="getRecords">
            </div>
            <div class="col-md-4">
                <select id="sortBy" class="form-select" v-model="filters.sortBy" @change="getRecords">
                    <option value="">Sort By...</option>
                    <option value="id">ID</option>
                    <option value="title">Title</option>
                    <option value="artist">Artist</option>
                    <option value="listnerasc">Listeners (Ascending)</option>
                    <option value="listenerdesc">Listeners (Descending)</option>
                </select>
            </div>
        </div>

        <!-- View Data -->
        <div v-if="records.length > 0">
            <h2>Records</h2>
            <ul class="list-group">
                <li class="list-group-item records" v-for="record in records" :key="record.id">
                    <strong>{{ record.title }}</strong> by {{ record.artist }} 
                    <span class="text-muted">({{ record.publicationYear }} - {{ record.listeners }} listeners)</span>
                </li>
            </ul>
        </div>
        <div v-else class="alert alert-warning">
            <p>No records found</p>
        </div>
        
        <p class="mt-3 text-info" v-if="message">{{ message }}</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
